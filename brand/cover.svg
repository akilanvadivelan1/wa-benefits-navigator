<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7C74"/>
      <stop offset="1" stop-color="#0B5E58"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A79B"/>
      <stop offset="1" stop-color="#0E7C74"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Soft decorative circles -->
  <circle cx="1080" cy="180" r="220" fill="#FFFFFF" opacity="0.05"/>
  <circle cx="1150" cy="600" r="160" fill="#FB7185" opacity="0.12"/>

  <!-- Logo mark -->
  <g transform="translate(110,90)">
    <circle cx="36" cy="36" r="36" fill="#FFFFFF"/>
    <path d="M20 37 L31 48 L53 24" stroke="#0E7C74" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="92" y="48" font-family="Helvetica, Arial, sans-serif" font-size="30"
          font-weight="700" fill="#FFFFFF">WA Benefits Navigator</text>
  </g>

  <!-- Badge -->
  <g transform="translate(110,210)">
    <rect x="0" y="0" width="330" height="44" rx="22" fill="#FFFFFF" opacity="0.14"/>
    <circle cx="26" cy="22" r="6" fill="#FB7185"/>
    <text x="44" y="29" font-family="Helvetica, Arial, sans-serif" font-size="17"
          font-weight="600" fill="#FFFFFF">For Washington families</text>
  </g>

  <!-- Headline -->
  <text x="108" y="330" font-family="Helvetica, Arial, sans-serif" font-size="68"
        font-weight="700" fill="#FFFFFF">Find the right programs</text>
  <text x="108" y="408" font-family="Helvetica, Arial, sans-serif" font-size="68"
        font-weight="700" fill="#FFFFFF">for your child in minutes</text>

  <!-- Subline -->
  <text x="110" y="470" font-family="Helvetica, Arial, sans-serif" font-size="26"
        fill="#CFF3EE">Plain language. English and Spanish. Backed by official sources.</text>

  <!-- Feature chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">
    <rect x="110" y="520" width="250" height="56" rx="28" fill="url(#chip)"/>
    <text x="150" y="556">15+ programs</text>

    <rect x="378" y="520" width="250" height="56" rx="28" fill="url(#chip)"/>
    <text x="410" y="556">Personalized plan</text>

    <rect x="646" y="520" width="230" height="56" rx="28" fill="url(#chip)"/>
    <text x="684" y="556">Free &amp; private</text>
  </g>

  <!-- URL -->
  <text x="110" y="660" font-family="Helvetica, Arial, sans-serif" font-size="22"
        font-weight="600" fill="#FFFFFF" opacity="0.9">wabenefitsnavigator.org</text>
</svg>
